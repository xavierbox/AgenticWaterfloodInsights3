<!DOCTYPE html>
<html>
<head>
  <title>Known Plots Catalog</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@latest/dist/jsoneditor.min.js"></script>

<style>
  .charts-catalog-layout {
    height: calc(100vh - 90px);
  }

  .card-title {

  font-size: 1.01em;
  font-weight: 600;

  }
  .charts-catalog-left,
  .charts-catalog-right {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .charts-catalog-list-panel {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
    max-height:60%;
  }

  .charts-catalog-selected-panel {
    flex: 0 0 160px;
    border-top: 1px solid #ccc;
    padding-top: 6px;
    max-height: 80%;
  }

  .charts-catalog-selected-list {
    max-height: 70%;
    overflow-y: auto;
    font-size: 0.78rem;
    margin-bottom: 6px;
  }

  .charts-catalog-selected-item {
    padding: 2px 4px;
    border-bottom: 1px solid #ddd;
  }

  .charts-catalog-card {
    cursor: pointer;
    border: 1px solid #ccc;
    transition: 0.15s ease;
    background-color: orange;
    font-size: 0.7rem;
  }

  .charts-catalog-card:hover {
    border-color: #0d6efd;
    box-shadow: 0 2px 8px rgba(13, 110, 253, 0.25);
  }

  .charts-catalog-card.selected {
    border: 2px solid #0d6efd;
    background-color: #eef5ff;
  }

  .charts-catalog-card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .charts-catalog-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .charts-catalog-table tr {
    cursor: pointer;
    border-bottom: 1px solid var(--separator-color, #ddd);
  }

  .charts-catalog-table tr:hover {
    background-color: rgba(13, 110, 253, 0.08);
  }

  .charts-catalog-table tr.selected {
    background-color: rgba(13, 110, 253, 0.18);
  }

  .charts-catalog-check-cell {
    width: 28px;
    padding: 3px 4px;
    text-align: center;
  }

  .charts-catalog-title-cell {
    padding: 3px 6px;
    font-weight: 600;
    white-space: nowrap;
  }

  .charts-catalog-parameter-panel {
    flex: 0 0 auto;
  }

  .charts-catalog-parameter-editor {
    font-size: 0.8rem;
  }

  .charts-catalog-parameter-editor .form-group {
    display: grid !important;
    grid-template-columns: 120px minmax(0, 1fr);
    align-items: center;
    column-gap: 6px;
    margin-bottom: 4px !important;
  }

  .charts-catalog-parameter-editor label {
    margin: 0 !important;
    font-size: 0.78rem !important;
    font-weight: 600;
    white-space: nowrap;
  }

  .charts-catalog-parameter-editor input,
  .charts-catalog-parameter-editor select,
  .charts-catalog-parameter-editor textarea {
    min-height: 22px !important;
    padding: 2px 6px !important;
    font-size: 0.78rem !important;
  }

  .charts-catalog-parameter-editor .form-text,
  .charts-catalog-parameter-editor small,
  .charts-catalog-parameter-editor .help-block {
    grid-column: 2;
    font-size: 0.7rem !important;
    margin: 0 !important;
  }

  .charts-catalog-parameter-editor .card,
  .charts-catalog-parameter-editor .card-body {
    padding: 2px 3px !important;
    margin: 0 !important;
    background-color: red !important;
  }

  .charts-catalog-parameter-editor .je-header span,
  .charts-catalog-parameter-editor h3 span,
  .charts-catalog-parameter-editor h4 span,
  .charts-catalog-parameter-editor .card-title span {
    display: none !important;
  }

  .charts-catalog-preview-panel {
    flex: 1 1 auto;
    min-height: 0;
    background: #7a0000;
    color: white;
    margin-top: 8px;
    padding: 8px;
    overflow: auto;
  }
</style>
</head>

<body>

<div class="container-fluid">

  <button id="fetch-catalog" class="btn btn-primary mb-3">
    Fetch Catalog
  </button>

  <charts-catalog-control id="charts-catalog"></charts-catalog-control>

  <!--h6 class="mt-4">Selected plots</h6>
  <pre id="selected-plots-output"></pre-->

</div>

<script>
class ChartsCatalogControl extends HTMLElement {
  constructor() {
    super();

    this.catalog = null;
    this.selectedPlot = null;
    this.selectedPlotIndexes = [];
    this.editedParametersByFunction = {};
    this.editor = null;
  }

  connectedCallback() {
    this.render1();
  }
updateSelectedCompactList() {
  const container = this.querySelector(
    '[data-role="charts-catalog-selected-list"]'
  );

  if (!container) return;

  const selected = this.getSelected();

  if (selected.length === 0) {
    container.innerHTML = `<div class="text-muted">No plots selected</div>`;
    return;
  }

  container.innerHTML = selected
    .map(plot => `
      <div class="charts-catalog-selected-item">
        ${plot.display_name}
      </div>
    `)
    .join("");
}
  render1() {
    this.innerHTML = `
      <div class="row charts-catalog-layout">
<div class="col-5 charts-catalog-left">
  <div
    data-role="charts-catalog-list"
    class="charts-catalog-list-panel"
  ></div>

  <div class="charts-catalog-selected-panel">
    <div
      data-role="charts-catalog-selected-list"
      class="charts-catalog-selected-list"
    ></div>

    <button
      data-role="charts-catalog-generate"
      class="btn btn-warning mt-2"
    >
      Generate
    </button>
  </div>
</div>

        <div class="col-7 charts-catalog-right">
          <div
            data-role="charts-catalog-parameter-editor"
            class="charts-catalog-parameter-editor charts-catalog-parameter-panel"
          ></div>

          <div>
            <button
              data-role="charts-catalog-apply-parameters"
              class="btn btn-success mt-2"
              disabled
            >
              Apply parameters
            </button>

            <button
              data-role="charts-catalog-reset-parameters"
              class="btn btn-primary mt-2"
              disabled
            >
              Reset parameters
            </button>
          </div>

          <div
            data-role="charts-catalog-preview"
            class="charts-catalog-preview-panel"
          >
            Preview placeholder
          </div>

          <pre data-role="charts-catalog-output" class="mt-2"></pre>
        </div>
      </div>
    `;

    this.bindButtons();
  }

  bindButtons() {
    this.applyButton = this.querySelector(
      '[data-role="charts-catalog-apply-parameters"]'
    );

    this.resetButton = this.querySelector(
      '[data-role="charts-catalog-reset-parameters"]'
    );

    this.generateButton = this.querySelector(
      '[data-role="charts-catalog-generate"]'
    );

    this.applyButton.addEventListener("click", () => {
      this.applyParameters();
    });

    this.resetButton.addEventListener("click", () => {
      this.resetParameters();
    });

    this.generateButton.addEventListener("click", () => {
      const selected = this.getSelected();
      console.log(selected);
    });
  }

  setCatalog(catalog) {
    this.catalog = catalog;
    this.selectedPlot = null;
    this.selectedPlotIndexes = [];
    this.editedParametersByFunction = {};

    if (this.editor) {
      this.editor.destroy();
      this.editor = null;
    }

    this.querySelector(
      '[data-role="charts-catalog-parameter-editor"]'
    ).innerHTML = "";

    this.querySelector(
      '[data-role="charts-catalog-output"]'
    ).textContent = "";

    this.renderCatalog1();
    this.updateSelectedCompactList();
    this.updateParameterButtonsState();
  }

  renderCatalog1() {
    const container = this.querySelector(
      '[data-role="charts-catalog-list"]'
    );

    container.innerHTML = "";

    if (!this.catalog || !Array.isArray(this.catalog.items)) {
      container.innerHTML = `
        <div class="alert alert-secondary">
          No catalog loaded.
        </div>
      `;
      return;
    }

    this.catalog.items.forEach((plot, index) => {
      const card = document.createElement("div");
      card.className = "card charts-catalog-card mb-2";
      card.dataset.index = index;

      card.innerHTML = `
        <div class="card-body">
          <div class="charts-catalog-card-header">
            <input
              type="checkbox"
              class="form-check-input charts-catalog-card-checkbox"
            />
            <div class="card-title mb-0">${plot.display_name}</div>
          </div>

          <p class="card-text">${plot.description}</p>
        </div>
      `;

      const header = card.querySelector(".charts-catalog-card-header");

      header.addEventListener("click", (event) => {
        event.stopPropagation();

        const wasSelected = this.selectedPlotIndexes.includes(index);

        this.togglePlotSelection(index);

        const isSelected = this.selectedPlotIndexes.includes(index);

        if (!wasSelected && isSelected) {
          this.showPlotParameters(index);
        }
      });

      card.addEventListener("click", () => {
        this.showPlotParameters(index);
      });

      container.appendChild(card);
    });
  }

  render2() {
    this.innerHTML = `
      <div class="row charts-catalog-layout">
        <div class="col-4 charts-catalog-left">
          <div
            data-role="charts-catalog-list"
            class="charts-catalog-list"
          ></div>
        </div>

        <div class="col-8 charts-catalog-right">
          <div
            data-role="charts-catalog-parameter-editor"
            class="charts-catalog-parameter-editor"
          ></div>

          <button
            data-role="charts-catalog-apply-parameters"
            class="btn btn-success mt-3"
            disabled
          >
            Apply parameters
          </button>

          <button
            data-role="charts-catalog-reset-parameters"
            class="btn btn-primary mt-3"
            disabled
          >
            Reset parameters
          </button>

          <button
            data-role="charts-catalog-generate"
            class="btn btn-warning mt-3 ms-2"
          >
            Generate
          </button>

          <pre data-role="charts-catalog-output" class="mt-3"></pre>
        </div>
      </div>
    `;

    this.bindButtons();
    this.renderCatalog2();
  }

  renderCatalog2() {
    const container = this.querySelector(
      '[data-role="charts-catalog-list"]'
    );

    container.innerHTML = "";

    if (!this.catalog || !Array.isArray(this.catalog.items)) {
      container.innerHTML = `
        <div class="alert alert-secondary">
          No catalog loaded.
        </div>
      `;
      return;
    }

    const table = document.createElement("table");
    table.className = "charts-catalog-table";

    const tbody = document.createElement("tbody");

    this.catalog.items.forEach((plot, index) => {
      const tr = document.createElement("tr");
      tr.className = "charts-catalog-row";
      tr.dataset.index = index;

      tr.innerHTML = `
        <td class="charts-catalog-check-cell">
          <input
            type="checkbox"
            class="form-check-input charts-catalog-checkbox"
          />
        </td>
        <td class="charts-catalog-title-cell">
          ${plot.display_name}
        </td>
      `;

      const checkboxCell = tr.querySelector(".charts-catalog-check-cell");
      const titleCell = tr.querySelector(".charts-catalog-title-cell");

      checkboxCell.addEventListener("click", (event) => {
        event.stopPropagation();

        this.togglePlotSelection(index);

        if (this.selectedPlotIndexes.includes(index)) {
          this.showPlotParameters(index);
        }
      });

      titleCell.addEventListener("click", (event) => {
        event.stopPropagation();

        this.togglePlotSelection(index);

        if (this.selectedPlotIndexes.includes(index)) {
          this.showPlotParameters(index);
        }
      });

      tr.addEventListener("click", () => {
        this.showPlotParameters(index);
      });

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.appendChild(table);

    this.updateCardSelectionStyles2();
  }

  togglePlotSelection(index) {
    const isSelected = this.selectedPlotIndexes.includes(index);

    if (isSelected) {
      this.selectedPlotIndexes =
        this.selectedPlotIndexes.filter(i => i !== index);
    } else {
      this.selectedPlotIndexes.push(index);
    }

    this.updateCardSelectionStyles1();
    this.updateSelectedCompactList();
    this.updateParameterButtonsState();
  }

  updateCardSelectionStyles1() {
    this.querySelectorAll(".charts-catalog-card").forEach((card) => {
      const index = Number(card.dataset.index);
      const isSelected = this.selectedPlotIndexes.includes(index);

      card.classList.toggle("selected", isSelected);

      const checkbox = card.querySelector(".charts-catalog-card-checkbox");
      checkbox.checked = isSelected;
    });
  }

  updateCardSelectionStyles2() {
    this.querySelectorAll(".charts-catalog-row").forEach((row) => {
      const index = Number(row.dataset.index);
      const isSelected = this.selectedPlotIndexes.includes(index);

      row.classList.toggle("selected", isSelected);

      const checkbox = row.querySelector(".charts-catalog-checkbox");
      checkbox.checked = isSelected;
    });
  }

  showPlotParameters(index) {
    this.selectedPlot = this.catalog.items[index];

    this.renderParameterEditor(this.selectedPlot);
    this.updateParameterButtonsState();
  }

  renderParameterEditor(plot) {
    const container = this.querySelector(
      '[data-role="charts-catalog-parameter-editor"]'
    );

    container.innerHTML = "";

    if (this.editor) {
      this.editor.destroy();
      this.editor = null;
    }

    const parameters = plot.parameters || {};

    if (Object.keys(parameters).length === 0) {
      container.innerHTML = `
        <div class="alert alert-secondary">
          This plot has no editable parameters.
        </div>
      `;
      return;
    }

    const schema = this.buildSchemaFromParameters(parameters);

    const data =
      this.editedParametersByFunction[plot.function] ||
      this.buildDataFromParameters(parameters);

    this.editor = new JSONEditor(container, {
      schema: schema,
      startval: data,
      theme: "bootstrap5",
      disable_edit_json: true,
      disable_properties: true,
      no_additional_properties: true,
      compact: true
    });
  }

  buildSchemaFromParameters(parameters) {
    const properties = {};

    Object.entries(parameters).forEach(([key, param]) => {
      properties[key] = {
        title: param.display_name,
        description: param.description,
        type: this.mapParameterType(param.type)
      };
    });

    return {
      type: "object",
      title: "Parameters",
      properties: properties
    };
  }

  buildDataFromParameters(parameters) {
    const data = {};

    Object.entries(parameters).forEach(([key, param]) => {
      data[key] = param.value;
    });

    return data;
  }

  mapParameterType(type) {
    if (type === "string") return "string";
    if (type === "float") return "number";
    if (type === "int") return "integer";
    if (type === "bool") return "boolean";

    return "string";
  }

  applyParameters() {
    if (!this.selectedPlot || !this.editor) {
      return;
    }

    const errors = this.editor.validate();

    if (errors.length > 0) {
      this.querySelector(
        '[data-role="charts-catalog-output"]'
      ).textContent = JSON.stringify(errors, null, 2);

      return;
    }

    this.editedParametersByFunction[this.selectedPlot.function] =
      this.editor.getValue();

    this.querySelector(
      '[data-role="charts-catalog-output"]'
    ).textContent = JSON.stringify({
      message: "Parameters applied",
      function: this.selectedPlot.function,
      parameters: this.editedParametersByFunction[this.selectedPlot.function]
    }, null, 2);
  }

  resetParameters() {
    if (!this.selectedPlot) {
      return;
    }

    delete this.editedParametersByFunction[this.selectedPlot.function];

    this.renderParameterEditor(this.selectedPlot);
    this.updateParameterButtonsState();

    this.querySelector(
      '[data-role="charts-catalog-output"]'
    ).textContent = JSON.stringify({
      message: "Parameters reset",
      display_name: this.selectedPlot.display_name,
      function: this.selectedPlot.function,
      parameters: this.buildDataFromParameters(this.selectedPlot.parameters || {})
    }, null, 2);
  }

  updateParameterButtonsState() {
    if (!this.catalog || !this.selectedPlot) {
      this.applyButton.disabled = true;
      this.resetButton.disabled = true;
      return;
    }

    const selectedIndex = this.catalog.items.findIndex(
      p => p.function === this.selectedPlot.function
    );

    const isDisplayedPlotSelected =
      selectedIndex >= 0 && this.selectedPlotIndexes.includes(selectedIndex);

    this.applyButton.disabled = !isDisplayedPlotSelected;
    this.resetButton.disabled = !isDisplayedPlotSelected;
  }

  getSelected() {
    if (!this.catalog) {
      return [];
    }

    return this.selectedPlotIndexes.map(index => {
      const plot = this.catalog.items[index];

      return {
        display_name: plot.display_name,
        function: plot.function,
        parameters:
          this.editedParametersByFunction[plot.function] ||
          this.buildDataFromParameters(plot.parameters || {})
      };
    });
  }
}

customElements.define("charts-catalog-control", ChartsCatalogControl);


document.getElementById("fetch-catalog").addEventListener("click", async () => {
  const response = await fetch("/fetch_known_plots_catalog");
  const catalog = await response.json();

  document
    .getElementById("charts-catalog")
    .setCatalog(catalog);
});
</script>

</body>
</html>
