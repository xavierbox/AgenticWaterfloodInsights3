<!DOCTYPE html>
<html>
<head>
  <title>Known Plots Catalog</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="p-3">

  <button id="fetch-catalog" class="btn btn-primary">
    Fetch Catalog
  </button>

  <div id="catalog-list" class="mt-3"></div>

  <pre id="output" class="mt-3"></pre>

  <script>
    async function fetchCatalog() {
      const response = await fetch("/fetch_known_plots_catalog");
      const catalog = await response.json();

      renderCatalog(catalog);
      document.getElementById("output").textContent =
        JSON.stringify(catalog, null, 2);
    }

    function renderCatalog(catalog) {
      const container = document.getElementById("catalog-list");
      container.innerHTML = "";

      catalog.items.forEach((plot) => {
        const card = document.createElement("div");
        card.className = "card mb-2";

        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">${plot.display_name}</h5>
            <div><strong>Category:</strong> ${plot.category}</div>
            <div><strong>Function:</strong> ${plot.function}</div>
            <p class="card-text">${plot.description}</p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    document
      .getElementById("fetch-catalog")
      .addEventListener("click", fetchCatalog);
  </script>

</body>
</html>
