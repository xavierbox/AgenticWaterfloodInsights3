<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waterflood Insights</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    wf-chatbox {
      display: block;
      width: 100%;
      height: 100%;
    }

    .wf-chatbox {
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .wf-chatbox-header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .wf-chatbox-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00e0ff, #1532ff 55%, #00d084);
    }

    .wf-chatbox-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #003cff;
      padding: 18px 12px 10px;
      flex-shrink: 0;
    }

    .wf-chatbox-subtitle {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin: 8px 0 24px;
      flex-shrink: 0;
    }

    .wf-chatbox-suggestions {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 0 28px;
      flex: 1;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .wf-chatbox-suggestion {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      border: 2px solid #9aa0d6;
      border-radius: 12px;
      background: white;
      color: #30408f;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 14px;
      text-align: left;
      box-shadow: inset 3px 0 0 #63efe9;
      transition: background 0.15s ease;
      white-space: normal;
      word-break: break-word;
    }

    .wf-chatbox-suggestion:hover {
      background: #f5f7ff;
    }

    .wf-chatbox-icon {
      width: 24px;
      height: 24px;
      border: 2px solid #2d46bd;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #2d46bd;
      font-size: 14px;
      flex-shrink: 0;
    }

    .wf-chatbox-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #777;
      border-radius: 28px;
      margin: 0 12px 12px;
      padding: 8px 10px 8px 18px;
      background: white;
      flex-shrink: 0;
    }

    .wf-chatbox-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      color: #333;
      background: transparent;
    }

    .wf-chatbox-input::placeholder {
      color: #aaa;
    }

    .wf-chatbox-send {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #002fff;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .wf-chatbox-send:hover {
      background: #001fc0;
    }
  </style>
</head>

<body>

  <wf-chatbox></wf-chatbox>

  <script>
    class WaterfloodInsightsAgentic extends HTMLElement {
      connectedCallback() {
        this.render();
      }

      render() {
        this.innerHTML = "";

        const root = document.createElement("div");
        root.className = "wf-chatbox";

        const header = document.createElement("div");
        header.className = "wf-chatbox-header";

        const logo = document.createElement("div");
        logo.className = "wf-chatbox-logo";

        header.appendChild(logo);

        const title = document.createElement("div");
        title.className = "wf-chatbox-title";
        title.textContent = "Waterflood insights analytics";

        const subtitle = document.createElement("div");
        subtitle.className = "wf-chatbox-subtitle";
        subtitle.textContent = "Here are some suggestions to get you started.";

        const suggestions = document.createElement("div");
        suggestions.className = "wf-chatbox-suggestions";

        const items = [
          "Display my newest surface and wells in a 2D window",
          "How do I make a grid for simulation?"
        ];

        items.forEach(text => {
          const button = document.createElement("button");
          button.className = "wf-chatbox-suggestion";
          button.type = "button";

          const icon = document.createElement("span");
          icon.className = "wf-chatbox-icon";
          icon.textContent = "↻";

          const label = document.createElement("span");
          label.textContent = text;

          button.appendChild(icon);
          button.appendChild(label);

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("suggestion-click", {
              bubbles: true,
              detail: { text }
            }));
          });

          suggestions.appendChild(button);
        });

        const inputRow = document.createElement("div");
        inputRow.className = "wf-chatbox-input-row";

        const input = document.createElement("input");
        input.className = "wf-chatbox-input";
        input.placeholder = "Ask Tela...";
        input.type = "text";

        const send = document.createElement("button");
        send.className = "wf-chatbox-send";
        send.type = "button";
        send.textContent = "➤";

        const submit = () => {
          const value = input.value.trim();
          if (!value) return;

          this.dispatchEvent(new CustomEvent("wf-chatbox-submit", {
            bubbles: true,
            detail: { text: value }
          }));

          input.value = "";
        };

        send.addEventListener("click", submit);

        input.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            submit();
          }
        });

        inputRow.appendChild(input);
        inputRow.appendChild(send);

        root.appendChild(header);
        root.appendChild(title);
        root.appendChild(subtitle);
        root.appendChild(suggestions);
        root.appendChild(inputRow);

        this.appendChild(root);
      }
    }

    customElements.define("wf-chatbox", WaterfloodInsightsAgentic);
  </script>

</body>
</html>
