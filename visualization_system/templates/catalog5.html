<!DOCTYPE html>
<html>
<head>
  <title>Waterflood Insights Analytics</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@latest/dist/jsoneditor.min.js"></script>


    <!-- Include your custom JS components here -->
    <script src="{{ url_for('static', filename='js/app_components.js') }}"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='js/styles.css') }}">


</head>

<body>
    <h4>vis system</h4>
  <div class="wf-page">
    <div class="wf-header">
      <div>
        <div class="wf-brand">
          <div class="wf-logo">W</div>
          <div>
            <div>Dashboard builder</div>
            <div class="wf-subtitle">Waterflood Insights</div>
          </div>
        </div>
      </div>

      <button id="fetch-catalog" class="btn btn-primary">
        Fetch Catalog
      </button>
    </div>

    <charts-catalog-control id="charts-catalog"></charts-catalog-control>

    <div class="wf-assistant-placeholder">
      Assistant placeholder: chart, chatbox, recommendations, or explanations will go here.
    </div>

    <!--pre id="selected-plots-output" style="display:none;"></pre-->
  </div>







<script>

document.getElementById("fetch-catalog").addEventListener("click", async () => {
  const response = await fetch("/fetch_known_plots_catalog");
  const catalog = await response.json();

  document
    .getElementById("charts-catalog")
    .setCatalog(catalog);
});


</script>


<script>
//document.documentElement.dataset.theme = "dark";


document.getElementById("charts-catalog")
  .addEventListener("generate-dashboard-plots", async (event) => {
    const selectedPlots = event.detail.selectedPlots;

    const response = await fetch("/generate_dashboard_plots", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(selectedPlots)
    });

    const result = await response.json();

    console.log("Backend response:", result);
  });

</script>
</body>
</html>
