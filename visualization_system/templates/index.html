<head>

<style>
  :root {
    --wf-bg: #f6f8fc;
    --wf-card-bg: #ffffff;
    --wf-border: #dfe5f1;
    --wf-text: #1d2b44;
    --wf-muted: #6c7a92;
    --wf-blue: #2563eb;
    --wf-blue-soft: #eef4ff;
    --wf-red: #8b0000;
    --wf-shadow: 0 8px 24px rgba(29, 43, 68, 0.08);
  }



  
.pane{
    background: var(--pane-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid var(--pane-border);
    border-radius: 12px;

    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
}
 


.card{
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--pane-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    
    /*background: linear-gradient(
        135deg,
        var(--card-gradient-start),
        var(--card-gradient-end)
    ) !important;*/
    
    /*background: linear-gradient(
        140deg,
        var(--card-gradient-start),
        var(--card-gradient-end)
    ) !important;*/
    

    color: var(--text-color) !important;

    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    transition: all 0.2s ease;
}

.card:hover{
    transform: translateY(-2px)!important;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35)!important;
    border-color: var(--hover-color) !important;
}



charts-catalog-control {

  height: 90vh;/*%;*/
  min-height: 0;
  display: block;
}

    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  }

  .wf-brand {

  }

    place-items: center;

  }

  .wf-subtitle {

  }

  .wf-main-grid {

  .xxwf-panel {

  .wf-panel-header {

  .wf-filter-chip {

   color: var(--text-color);

.wf-filter-chip:hover{
  border-bottom: 1px solid var(--wf-blue);
  
}

  .charts-catalog-special-card {

  .charts-catalog-special-button {

  .charts-catalog-special-text {

  .charts-catalog-card {

  .charts-catalog-card-header {
    display: flex;
    align-items: center;
    gap: 8px;

  }

  .charts-catalog-card-title {

  }

  .charts-catalog-section-title {

  .charts-catalog-parameter-editor {

  .charts-catalog-parameter-editor .form-group {

    align-items: center;
    column-gap: 8px;
    margin-bottom: 6px !important;
  }

  .charts-catalog-parameter-editor label {
    margin: 0 !important;
    font-size: 0.78rem !important;

  .charts-catalog-parameter-editor input,

  .charts-catalog-parameter-editor textarea {

    padding: 3px 8px !important;

  .charts-catalog-parameter-editor .form-text,
  .charts-catalog-parameter-editor small,

    grid-column: 2;
    font-size: 0.7rem !important;
    margin: 0 !important;
  }

  .charts-catalog-parameter-editor .card,
  .charts-catalog-parameter-editor .card-body {

  .charts-catalog-parameter-editor .je-header span,
  .charts-catalog-parameter-editor h3 span,
  .charts-catalog-parameter-editor h4 span,

  }

  .charts-catalog-actions {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    margin: 10px 0 14px 0;
  }

  .charts-catalog-preview-label {
    display: inline-block;
    border: 2px solid #12263f;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 900;
    margin-bottom: 8px;
    background: white;
  }

  .charts-catalog-preview-panel {
    /*flex: 1 1 auto;*/
    height: 100%;
    min-height: 50%;
    background: var(--wf-red);
    color: white;
    border-radius: 10px;
    padding: 12px;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .charts-catalog-selection-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 7px;
    border-radius: 999px;
    background: #e5eaf3;
    color: var(--wf-muted);
    font-size: 12px;
    margin-left: 8px;
  }

  .charts-catalog-selected-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 12px 12px 12px;
  }

  .charts-catalog-selected-item {
    border: 1px solid var(--wf-border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: white;

    font-size: 13px;
  }

  .charts-catalog-selected-empty {
    color: var(--wf-muted);
    font-size: 13px;
    padding: 8px 2px;
  }

  .charts-catalog-right-footer {
    flex: 0 0 auto;
    padding: 12px;
    border-top: 1px solid var(--wf-border);
  }

  .wf-assistant-placeholder {
    flex: 0 0 145px;
    background: var(--wf-card-bg);
    border: 1px solid var(--wf-border);
    border-radius: 12px;
    box-shadow: var(--wf-shadow);

    display: flex;

    justify-content: center;

</style>

<body>



<chat-dialog id="chat-dialog"></chat-dialog>

<new-three-column-main-layout id="main-layout">
<div class="card" id="data-selection-card" style="display: block;">
            <div>
                <label id="project_name" class="subtitle">Demo1</label>
                <hr>

                <p class="subtitle">Reservoir management unit</p>
                <combobox-component id="reservoir-unit-selector" data-info="{&quot;creation_date&quot;:&quot;2024-09-06&quot;,&quot;dates&quot;:[&quot;Mon, 05 Oct 2020 00:00:00 GMT&quot;,&quot;Thu, 25 Nov 2021 00:00:00 GMT&quot;],&quot;project_name&quot;:&quot;Demo1&quot;,&quot;reservoirs&quot;:{&quot;RAWA&quot;:{&quot;LW&quot;:[0],&quot;RW&quot;:[0]}},&quot;studies&quot;:[&quot;TestNewExport&quot;,&quot;xxx&quot;,&quot;TestModel1&quot;,&quot;Demo1&quot;],&quot;tag&quot;:&quot;demo,xavier&quot;,&quot;tags&quot;:&quot;*&quot;}">
            <select class="form-select combobox"><option disabled="true" selected="true">Select option</option><option value="LW">LW</option><option value="RW">RW</option></select>
        </combobox-component>
            </div>
            <div>
   
                <details><summary class="subtitle mt-2">Sectors</summary>
                <two-column-checkbox-list id="sector-selector"><div class="checkbox-rows-container row g-3"><div class="col-6 checkbox-col"></div><div class="col-6 checkbox-col"></div></div></two-column-checkbox-list>
               </details>
            </div>
            <div>
                <p class="subtitle">Time frame</p>

                <div class="d-flex align-items-center mb-3">
                    <label for="start-date">Start:</label>
                    <input type="date" id="start-date" name="start-date" class="form-control form-control-sm mb-2">
    
                  </div>

                  <div class="d-flex align-items-center mb-3">

                <label for="end-date">End: </label>
                <input type="date" id="end-date" name="end-date" class="form-control form-control-sm">
            </div>
 
                <p></p>
                Displace time frame and load data 
                <div class="d-flex align-items-center gap-2">
                    
                    <button class="btn btn-sm btn-primary" id="time-frame-player-left-button">
                        <i class="fa fa-caret-left"></i>
                    </button>
                    <input type="number" id="range-value" name="range-value" class="form-control form-control-sm" min="1" max="180" value="1" style="width: 80px;">
                    <button class="btn btn-sm btn-primary" id="time-frame-player-right-button">
                        <i class="fa fa-caret-right"></i>
                    </button>
                </div>
        
            </div>
            <hr>
            <div style="display:flex; gap:10px">
            <button id="apply-data-selection-button" class="btn btn-primary">Apply</button>   
            <button class="well-selection-indicator" style="display: none;"><span>⚠Well selection active</span></button>
            </div>
            
</div>

 
  <tabs-component id="tabs"></tabs-component>


</new-three-column-main-layout> 

<charts-catalog-control id="charts-catalog"></charts-catalog-control>

    <h4>vis system</h4>
   <button id="fetch-catalog" class="btn btn-primary">
        Fetch Catalog
      </button>


<script>

let selected_well_names = [] 


function Id( x ){

    return document.querySelector("#"+x)
}
function get_project_data_selection( ){

    debugger;
    let data = {}
    data['subzone'] = Id('reservoir-unit-selector').getValue();
    data['date']   = [Id('start-date').value, Id('end-date').value];
    data['sector'] = Id('sector-selector').getCheckedItems().map(str => parseInt(str));
    data['project_name'] = Id('project_name').innerHTML;
    

    if((selected_well_names != undefined) && (selected_well_names.length > 0))
        data['name']   = selected_well_names
  
    return data;

}



document.addEventListener("DOMContentLoaded", () => {
    const sectorSelector = document.getElementById("sector-selector");
    if (sectorSelector) {
        // Creates elements: ["1", "2", "3"]
        sectorSelector.set_data(["1", "2", "3"]);
    }

    document.documentElement.setAttribute('data-theme', 'dark');

    let layout = document.querySelector("#main-layout");

    layout.set('left-top',Id('data-selection-card'));
    layout.set('right',Id('chat-dialog'));
    
    //layout.set('middle',Id('charts-catalog'));
    
    const chartIcon = Object.assign(document.createElement("i"), {className: "fa-solid fa-globe"});
    let tabs = document.getElementById('tabs');
    tabs.addTabWithContent("Home", Id('charts-catalog'),chartIcon);
    tabs.disableClose("Home", true);
    layout.set('middle',Id('tabs'));
  


    const comboComponent = document.getElementById("reservoir-unit-selector");
    if (comboComponent) {
        // Set the explicit string options using its built-in method
        comboComponent.setData(["Demo1", "IX5I_4P"]);

         // 2. Fetch non-disabled options list and pick the first index [0]
        const availableOptions = comboComponent.getOptions();
        if (availableOptions.length > 0) {
            comboComponent.setValue(availableOptions[0]); // Selects "Demo1"
        }

    }
    const sectorsDetails = document.querySelector("#data-selection-card details");

    if (sectorsDetails) {
        // Programmatically expand the details block
        sectorsDetails.open = true;
    }

    const startDateInput = document.getElementById("start-date");
    const endDateInput = document.getElementById("end-date");

    // Set Start Date to June 15, 2022
    if (startDateInput) {
        startDateInput.value = "2022-06-15";
    }

    // Set End Date to June 15, 2027
    if (endDateInput) {
        endDateInput.value = "2027-06-15";
    }

});



document.getElementById("apply-data-selection-button").addEventListener('click',()=>{

console.log("Data selected");

});

document.getElementById("chat-dialog").addEventListener('chat:user_message', function(evt) {
   
    const user_text = evt.detail.text;
    // Guard Clause: Returns early if text is null, undefined, or an empty string ""
    if (!user_text || user_text.trim() === "") {
        return;
    } console.log('user text', evt.detail.text);

    debugger;
    let project_data_description_from_ui = get_project_data_selection();
        
    console.log(project_data_description_from_ui);


});


document.getElementById("fetch-catalog").addEventListener("click", async () => {
  
 
  debugger;
  const response = await fetch("/fetch_known_plots_catalog");
  const catalog = await response.json();

  document
    .getElementById("charts-catalog")
    .setCatalog(catalog);
    
});


</script>
</body>
